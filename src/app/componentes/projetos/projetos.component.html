<section class="projetos section" id="projects">
  <div class="container">
    <h2 class="section-title">Projetos</h2>

    <div class="projetos__list">
      @for (projeto of projetos; track projeto.nome) {
        <article class="projeto-card">
          <img
            [src]="projeto.imagem"
            [alt]="'Screenshot do projeto ' + projeto.nome"
            class="projeto-card__image"
          >
          <div class="projeto-card__overlay">
            <div class="projeto-card__links">
              <a [href]="projeto.githubLink || '#'" target="_blank" class="projeto-card__link" aria-label="Ver código no GitHub" title="Código Fonte">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.02c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A4.8 4.8 0 0 0 8 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
              </a>
              <a [href]="projeto.demoLink || '#'" target="_blank" class="projeto-card__link" aria-label="Ver demonstração" title="Visualização">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </a>
            </div>
            <div class="projeto-card__content">
              <h3 class="projeto-card__title">{{ projeto.nome }}</h3>
              <p class="projeto-card__desc" [class.projeto-card__desc--expanded]="projeto.expandido">{{ projeto.descricao }}</p>
              <button class="projeto-card__btn-expandir" (click)="toggleExpandir(projeto, $event)">
                {{ projeto.expandido ? 'Ler menos' : 'Ler mais' }}
              </button>
              <span class="projeto-card__stack">{{ projeto.stack }}</span>
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
