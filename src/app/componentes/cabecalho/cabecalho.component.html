<header class="navbar" [class.scrolled]="isScrolled()">
  <div class="navbar__inner">

    <!-- Logo -->
    <a href="#home" class="navbar__logo" (click)="closeMenu()">Matheus</a>

    <!-- Nav Desktop (visível ≥ 768px) -->
    <nav class="navbar__desktop-nav" aria-label="Navegação principal">
      <a href="#about" class="nav-link" (click)="closeMenu()">Sobre mim</a>
      <a href="#projects" class="nav-link" (click)="closeMenu()">Projetos</a>
      <a href="#knowledge" class="nav-link" (click)="closeMenu()">Conhecimentos</a>
      <a href="#contact" class="nav-link" (click)="closeMenu()">Fale comigo</a>

      <div class="navbar__desktop-socials">
        <!-- Instagram -->
        <a href="https://www.instagram.com/matheusmiotoo/" target="_blank" rel="noopener" aria-label="Instagram"
          class="social-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>
        <!-- GitHub -->
        <a href="https://github.com/MatheusMioto" target="_blank" rel="noopener" aria-label="GitHub"
          class="social-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
            </path>
          </svg>
        </a>
        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/matheusmi0t0" target="_blank" rel="noopener" aria-label="LinkedIn" class="social-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
            <rect x="2" y="9" width="4" height="12"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>

        <!-- Divisor vertical -->
        <span class="navbar__divider" aria-hidden="true"></span>

        <!-- Theme Toggle inline (desktop) -->
        <button class="navbar__theme-btn" (click)="toggleTheme()"
          [attr.aria-label]="lightMode() ? 'Ativar modo escuro' : 'Ativar modo claro'">
          @if (lightMode()) {
          <!-- Moon icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          } @else {
          <!-- Sun icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          }
        </button>
      </div>
    </nav>

    <!-- Hamburger (visível < 768px) -->
    <div class="navbar__mobile-actions">
      <button class="navbar__theme-btn" (click)="toggleTheme()"
        [attr.aria-label]="lightMode() ? 'Ativar modo escuro' : 'Ativar modo claro'">
        @if (lightMode()) {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        } @else {
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        }
      </button>

      <button class="navbar__hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu"
        aria-controls="mobile-drawer-panel">
        <span class="hamburger-line" [class.open]="menuOpen()"></span>
        <span class="hamburger-line" [class.open]="menuOpen()"></span>
        <span class="hamburger-line" [class.open]="menuOpen()"></span>
      </button>
    </div>

  </div>
</header>

<!-- =====================================================
     MOBILE DRAWER (< 768px)
     ===================================================== -->
<div class="mobile-drawer" [class.open]="menuOpen()" aria-hidden="true">

  <!-- Backdrop -->
  <div class="mobile-drawer__backdrop" (click)="closeMenu()"></div>

  <!-- Painel lateral -->
  <aside class="mobile-drawer__panel" id="mobile-drawer-panel" role="dialog" aria-modal="true"
    aria-label="Menu de navegação">

    <div class="mobile-drawer__header">
      <a href="#home" class="navbar__logo" (click)="closeMenu()">Matheus</a>
      <button class="mobile-drawer__close" (click)="closeMenu()" aria-label="Fechar menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="mobile-drawer__nav" aria-label="Navegação mobile">
      <a href="#about" class="drawer-link" (click)="closeMenu()">Sobre mim</a>
      <a href="#projects" class="drawer-link" (click)="closeMenu()">Projetos</a>
      <a href="#knowledge" class="drawer-link" (click)="closeMenu()">Conhecimentos</a>
      <a href="#contact" class="drawer-link" (click)="closeMenu()">Fale comigo</a>
    </nav>

    <div class="mobile-drawer__socials">
      <a href="https://www.instagram.com/matheusmiotoo/" target="_blank" rel="noopener" aria-label="Instagram"
        class="social-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a href="https://github.com/MatheusMioto" target="_blank" rel="noopener" aria-label="GitHub" class="social-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
          </path>
        </svg>
      </a>
      <a href="https://www.linkedin.com/in/matheusmi0t0" target="_blank" rel="noopener" aria-label="LinkedIn" class="social-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
          <rect x="2" y="9" width="4" height="12"></rect>
          <circle cx="4" cy="4" r="2"></circle>
        </svg>
      </a>
    </div>

  </aside>
</div>
